<script>
    
    (function() {
        const menuToggle = document.getElementById('menu-toggle');
        const menu = document.getElementById('menu');
        
        function isMobile() {
            return window.innerWidth <= 768;
        }
        
        function closeMenu() {
            if (menu && menuToggle) {
                menu.classList.remove('menu-open');
                menuToggle.classList.remove('menu-toggle-active');
                menuToggle.setAttribute('aria-expanded', 'false');
            }
        }
        
        function openMenu() {
            if (menu && menuToggle) {
                menu.classList.add('menu-open');
                menuToggle.classList.add('menu-toggle-active');
                menuToggle.setAttribute('aria-expanded', 'true');
            }
        }
        
        if (menuToggle && menu) {
            
            menuToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isMobile()) {
                    const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
                    if (isExpanded) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                }
            });
            
            
            const menuLinks = menu.querySelectorAll('a');
            menuLinks.forEach(function(link) {
                link.addEventListener('click', function() {
                    if (isMobile()) {
                        closeMenu();
                    }
                });
            });
            
            
            document.addEventListener('click', function(event) {
                if (isMobile()) {
                    const isClickInsideMenu = menu.contains(event.target);
                    const isClickOnToggle = menuToggle.contains(event.target);
                    
                    if (!isClickInsideMenu && !isClickOnToggle && menu.classList.contains('menu-open')) {
                        closeMenu();
                    }
                }
            });
            
            
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    if (!isMobile() && menu.classList.contains('menu-open')) {
                        closeMenu();
                    }
                }, 250);
            });
            
            
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && menu.classList.contains('menu-open')) {
                    closeMenu();
                }
            });
        }
    })();
</script>

</div><script>
(function() {
  
  if (window.photoGalleryInitialized) return;
  window.photoGalleryInitialized = true;
  
  const gallery = document.getElementById('photoGallery');
  const lightbox = document.getElementById('lightbox');
  if (!gallery || !lightbox) return;
  
  const lightboxImage = document.getElementById('lightboxImage');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  
  let currentIndex = 0;
  let photos = [];
  
  
  function updatePhotosArray() {
    photos = [];
    const allGalleries = document.querySelectorAll('.photo-gallery');
    allGalleries.forEach(g => {
      const items = Array.from(g.querySelectorAll('.photo-item'));
      items.forEach(item => {
        
        if (item.style.display !== 'none' && item.offsetParent !== null) {
          photos.push(item);
        }
      });
    });
  }
  
  
  updatePhotosArray();
  
  
  setTimeout(updatePhotosArray, 500);
  setTimeout(updatePhotosArray, 1500);
  
  function openLightbox(index) {
    if (photos.length === 0) return;
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  
  function closeLightbox() {
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
  }
  
  function updateLightbox() {
    if (photos.length === 0) return;
    const photo = photos[currentIndex];
    const img = photo.querySelector('img');
    const caption = photo.getAttribute('data-caption') || img.getAttribute('alt') || '';
    
    lightboxImage.src = photo.getAttribute('data-src') || img.src;
    lightboxCaption.textContent = caption;
  }
  
  function showNext() {
    currentIndex = (currentIndex + 1) % photos.length;
    updateLightbox();
  }
  
  function showPrev() {
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    updateLightbox();
  }
  
  
  photos.forEach((photo, index) => {
    photo.addEventListener('click', () => openLightbox(index));
  });
  
  if (lightboxClose) {
    lightboxClose.addEventListener('click', closeLightbox);
  }
  
  if (lightboxPrev) {
    lightboxPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      showPrev();
    });
  }
  
  if (lightboxNext) {
    lightboxNext.addEventListener('click', (e) => {
      e.stopPropagation();
      showNext();
    });
  }
  
  if (lightbox) {
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });
  }
  
  
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    
    if (e.key === 'Escape') {
      closeLightbox();
    } else if (e.key === 'ArrowLeft') {
      showPrev();
    } else if (e.key === 'ArrowRight') {
      showNext();
    }
  });
})();
</script>

        const copybutton = document.createElement('button');
        copybutton.classList.add('copy-code');
        copybutton.innerHTML = 'copy';

        function copyingDone() {
            copybutton.innerHTML = 'copied!';
            setTimeout(() => {
                copybutton.innerHTML = 'copy';
            }, 2000);
        }

        copybutton.addEventListener('click', (cb) => {
            if ('clipboard' in navigator) {
                navigator.clipboard.writeText(codeblock.textContent);
                copyingDone();
                return;
            }

            const range = document.createRange();
            range.selectNodeContents(codeblock);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            try {
                document.execCommand('copy');
                copyingDone();
            } catch (e) { };
            selection.removeRange(range);
        });
